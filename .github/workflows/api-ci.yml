name: API DevSecOps CI

on:
  pull_request:
    paths:
      - "services/api/**"
      - "deploy/k8s/base/**"
      - "infra/terraform/**"
      - ".github/workflows/api-ci.yml"
  push:
    branches:
      - main
    paths:
      - "services/api/**"
      - "deploy/k8s/base/**"
      - "infra/terraform/**"
      - ".github/workflows/api-ci.yml"

env:
  API_DIR: services/api
  DOCKERFILE_PATH: services/api/Dockerfile
  IMAGE_NAME: scholarship-platform-api
  PUBLISHED_IMAGE: docker.io/kuberpull/scholarship-platform-api
  LOCAL_IMAGE_TAG: local/scholarship-platform-api:ci
  K8S_DEPLOYMENT_FILE: deploy/k8s/base/api-deployment.yaml
  SHA_TAG: sha-${{ github.sha }}

jobs:
  lint-test:
    name: Lint And Test
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum

      - name: Run Go tests
        working-directory: ${{ env.API_DIR }}
        run: go test ./...

      - name: Run Go vet
        working-directory: ${{ env.API_DIR }}
        run: go vet ./...

      - name: Build API binary
        working-directory: ${{ env.API_DIR }}
        run: go build ./cmd/api

      - name: Lint Dockerfile with Hadolint
        run: docker run --rm -i hadolint/hadolint < ${{ env.DOCKERFILE_PATH }}

  iac-scan:
    name: IaC Scan
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Terraform with Checkov
      
        run: >
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          bridgecrew/checkov
          --directory /repo/infra/terraform
          --skip-check CKV_AWS_38,CKV_AWS_39,CKV_AWS_58,CKV_AWS_339,CKV_AWS_288,CKV_AWS_290,CKV_AWS_355,CKV_AWS_130,CKV_AWS_158,CKV_AWS_338
          --quiet

      - name: Scan Kubernetes manifests with Checkov
        run: >
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          bridgecrew/checkov
          --directory /repo/deploy/k8s/base
          --framework kubernetes
          --skip-check CKV_K8S_43,CKV_K8S_35
          --quiet

  image-build-scan:
    name: Image Build And Scan
    runs-on: ubuntu-latest
    needs:
      - lint-test
      - iac-scan
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: false
          load: true
          tags: ${{ env.LOCAL_IMAGE_TAG }}

      - name: Scan API image with Trivy
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.63.0
          image
          --severity HIGH,CRITICAL
          --exit-code 1
          --no-progress
          ${{ env.LOCAL_IMAGE_TAG }}

  publish-and-gitops:
    name: Publish Image And Update GitOps Manifests
    runs-on: ubuntu-latest
    needs:
      - lint-test
      - iac-scan
      - image-build-scan
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: true
          tags: |
            ${{ env.PUBLISHED_IMAGE }}:${{ env.SHA_TAG }}
            ${{ env.PUBLISHED_IMAGE }}:main

      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail
          YQ_VERSION="v4.44.3"
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

      - name: Update Kubernetes image tag
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ env.PUBLISHED_IMAGE }}:${{ env.SHA_TAG }}"
          export IMAGE
          yq -i '
            (.spec.template.spec.containers[] | select(.name == "api") | .image) = strenv(IMAGE)
          ' "${K8S_DEPLOYMENT_FILE}"

      - name: Commit GitOps manifest update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- "${K8S_DEPLOYMENT_FILE}"; then
            echo "No manifest change detected."
            exit 0
          fi

          git add "${K8S_DEPLOYMENT_FILE}"
          git commit -m "chore(gitops): update api image to ${{ env.SHA_TAG }} [skip ci]"
          git push
