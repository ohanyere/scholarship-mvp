apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: scholarship-platform

resources:
  - namespace.yaml
  - configmap.yaml
  - api-service.yaml
  - api-deployment.yaml
  - postgres-service.yaml
  - postgres-deployment.yaml
  - redis-service.yaml
  - redis-deployment.yaml
  - default-deny-ingress-networkpolicy.yaml
  - allow-api-ingress-networkpolicy.yaml
  - allow-postgres-from-api-networkpolicy.yaml
  - allow-redis-from-api-networkpolicy.yaml
 
