apiVersion: apps/v1
kind: Deployment
metadata:
  name: scholarship-platform-postgres
  namespace: scholarship-platform
  annotations:
    checkov.io/skip1: CKV_K8S_22=Postgres needs a writable filesystem for database state and bootstrap, so read-only root filesystem is intentionally not enforced here.
    checkov.io/skip2: CKV_K8S_23=The upstream Postgres image may need root-owned startup steps during bootstrap; forcing a non-root UID here risks breaking the current dev database.
    checkov.io/skip3: CKV_K8S_40=We are intentionally not pinning a high UID for Postgres until we move to a hardened image and stateful storage setup validated for that runtime user.
  labels:
    app.kubernetes.io/name: scholarship-platform-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scholarship-platform-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scholarship-platform-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: Always
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: scholarship-platform-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: scholarship-platform-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scholarship-platform-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
