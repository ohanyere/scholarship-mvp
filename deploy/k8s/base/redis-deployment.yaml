apiVersion: apps/v1
kind: Deployment
metadata:
  name: scholarship-platform-redis
  labels:
    app.kubernetes.io/name: scholarship-platform-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scholarship-platform-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scholarship-platform-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
