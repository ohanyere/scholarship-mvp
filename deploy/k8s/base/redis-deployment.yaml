apiVersion: apps/v1
kind: Deployment
metadata:
  name: scholarship-platform-redis
  namespace: scholarship-platform
  annotations:
    checkov.io/skip1: CKV_K8S_22=This MVP Redis container is kept close to the upstream image, and read-only root filesystem is deferred until the image runtime paths are hardened and tested.
    checkov.io/skip2: CKV_K8S_23=The upstream Redis image is kept close to default for this MVP environment; forcing a non-root UID without image-specific validation could break startup.
    checkov.io/skip3: CKV_K8S_40=We are intentionally not pinning Redis to a high UID until the runtime user is hardened and tested against this container image.
  labels:
    app.kubernetes.io/name: scholarship-platform-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scholarship-platform-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scholarship-platform-redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: Always
          command: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
