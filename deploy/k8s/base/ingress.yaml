apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scholarship-platform-api
  namespace: scholarship-platform
  labels:
    app.kubernetes.io/name: scholarship-platform-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
spec:
  ingressClassName: nginx
  rules:
    - host: scholarship-platform.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scholarship-platform-api
                port:
                  number: 80
