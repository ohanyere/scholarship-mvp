apiVersion: apps/v1
kind: Deployment
metadata:
  name: scholarship-platform-api
  namespace: scholarship-platform
  labels:
    app.kubernetes.io/name: scholarship-platform-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scholarship-platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scholarship-platform-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: docker.io/kuberpull/scholarship-platform-api:sha-1ab320d74ae73aac5fafe57a407898e5e56d365b
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          envFrom:
            - configMapRef:
                name: scholarship-platform-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scholarship-platform-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scholarship-platform-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: scholarship-platform-secrets
                  key: JWT_SECRET
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: scholarship-platform-secrets
                  key: AI_API_KEY
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
